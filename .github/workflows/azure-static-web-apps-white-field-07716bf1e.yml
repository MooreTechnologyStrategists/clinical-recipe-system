name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Install deps
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build
        working-directory: frontend
        run: yarn build

      - name: Verify build output
        run: |
          echo "📁 Checking frontend/dist directory..."
          ls -la frontend/dist || echo "❌ dist directory not found!"
          echo ""
          echo "📄 Files in dist:"
          find frontend/dist -type f 2>/dev/null || echo "❌ No files found in dist!"
          echo ""
          echo "📊 Checking if index.html exists:"
          if [ -f frontend/dist/index.html ]; then
            echo "✅ index.html found"
            echo "📝 First 10 lines of index.html:"
            head -10 frontend/dist/index.html
          else
            echo "❌ index.html MISSING!"
            echo "🔍 Looking for HTML files anywhere in frontend:"
            find frontend -name "*.html" -type f
          fi
          echo ""
          echo "📦 Total files in dist:"
          find frontend/dist -type f 2>/dev/null | wc -l

      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_FIELD_07716BF1E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./frontend"
          api_location: "backend"
          output_location: "dist"
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_FIELD_07716BF1E }}
          action: "close"